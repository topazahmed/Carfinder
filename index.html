<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarFinder - Search Cars</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        #video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.85) 0%, rgba(118, 75, 162, 0.85) 100%);
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .search-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        .search-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .view-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .view-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .view-btn.active {
            background: #667eea;
            color: white;
        }

        .view-btn:hover {
            background: #667eea;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .results-table-container {
            overflow-x: auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        .results-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
            cursor: pointer;
            user-select: none;
            transition: background 0.3s;
        }

        .results-table th.sortable:hover {
            background: linear-gradient(135deg, #5568d3 0%, #6539a0 100%);
        }

        .results-table th.sortable::after {
            content: ' ⇅';
            opacity: 0.5;
            font-size: 0.9em;
        }

        .results-table th.sorted-asc::after {
            content: ' ↑';
            opacity: 1;
        }

        .results-table th.sorted-desc::after {
            content: ' ↓';
            opacity: 1;
        }

        .results-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .results-table tr:hover {
            background: #f8f9fa;
        }

        .results-table tr:last-child td {
            border-bottom: none;
        }

        .table-price {
            color: #28a745;
            font-weight: bold;
            font-size: 1.1em;
        }

        .table-year {
            font-weight: 600;
            color: #333;
        }

        .table-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .table-link:hover {
            text-decoration: underline;
        }

        .table-source {
            display: inline-block;
            padding: 4px 8px;
            background: #667eea;
            color: white;
            border-radius: 4px;
            font-size: 0.85em;
        }

        .car-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .car-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .car-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .car-price {
            font-size: 1.5em;
            color: #28a745;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .car-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .detail-item {
            display: flex;
            align-items: center;
            color: #666;
        }

        .detail-label {
            font-weight: 600;
            margin-right: 5px;
        }

        .car-description {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            color: #666;
            font-size: 0.9em;
            line-height: 1.5;
            max-height: 100px;
            overflow-y: auto;
        }

        .car-description:empty {
            display: none;
        }

        .car-source {
            display: inline-block;
            padding: 5px 10px;
            background: #667eea;
            color: white;
            border-radius: 5px;
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        .car-link {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .car-link:hover {
            background: #764ba2;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .no-results h2 {
            color: #666;
            margin-bottom: 10px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <!-- Video Background -->
    <video id="video-background" autoplay muted loop playsinline>
        <source src="assets/3572-172488159_medium.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div class="container">
        <div class="header">
            <h1>🚗 CarFinder</h1>
            <p>Search for cars across multiple websites</p>
        </div>

        <div class="search-card">
            <form id="searchForm" class="search-form">
                <div class="form-group">
                    <label for="make">Make *</label>
                    <input type="text" id="make" name="make" placeholder="e.g., Honda" required>
                </div>
                <div class="form-group">
                    <label for="model">Model *</label>
                    <input type="text" id="model" name="model" placeholder="e.g., Civic" required>
                </div>
                <div class="form-group">
                    <label for="location">Location (Optional)</label>
                    <input type="text" id="location" name="location" placeholder="e.g., Toronto">
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end;">
                    <button type="submit" class="search-btn">Search Cars</button>
                </div>
            </form>
        </div>

        <div id="loading" class="search-card" style="display: none;">
            <div class="loading">
                <div class="spinner"></div>
                <p>Searching for cars...</p>
            </div>
        </div>

        <div id="error" style="display: none;"></div>

        <div id="results" style="display: none;">
            <div class="search-card">
                <div id="stats" class="stats"></div>
                <div class="view-toggle">
                    <button class="view-btn active" id="gridViewBtn">
                        📱 Card View
                    </button>
                    <button class="view-btn" id="tableViewBtn">
                        📊 Table View
                    </button>
                </div>
                <div id="resultsGrid" class="results-grid"></div>
                <div id="resultsTable" class="results-table-container" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = new URLSearchParams(window.location.search).get('api') ||
            (window.location.protocol === 'file:' ? 'http://127.0.0.1:8000' :
            ['localhost', '127.0.0.1'].includes(window.location.hostname) ? window.location.origin :
            'https://carfinder-production-6990.up.railway.app');
        let currentView = 'grid';
        let currentData = null;

        // View toggle handlers
        document.getElementById('gridViewBtn').addEventListener('click', () => {
            currentView = 'grid';
            document.getElementById('gridViewBtn').classList.add('active');
            document.getElementById('tableViewBtn').classList.remove('active');
            document.getElementById('resultsGrid').style.display = 'grid';
            document.getElementById('resultsTable').style.display = 'none';
        });

        document.getElementById('tableViewBtn').addEventListener('click', () => {
            currentView = 'table';
            document.getElementById('tableViewBtn').classList.add('active');
            document.getElementById('gridViewBtn').classList.remove('active');
            document.getElementById('resultsGrid').style.display = 'none';
            document.getElementById('resultsTable').style.display = 'block';
        });

        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const make = document.getElementById('make').value;
            const model = document.getElementById('model').value;
            const location = document.getElementById('location').value;
            
            // Show loading, hide results and errors
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            
            try {
                // Build query parameters
                let url = `${API_BASE_URL}/api/search?make=${encodeURIComponent(make)}&model=${encodeURIComponent(model)}`;
                if (location) {
                    url += `&location=${encodeURIComponent(location)}`;
                }
                
                // Make API request
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`API error: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                // Parse and enhance data
                currentData = parseCarData(data);
                
                // Hide loading
                document.getElementById('loading').style.display = 'none';
                
                // Display results
                displayResults(currentData);
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').innerHTML = `
                    <div class="search-card error">
                        <strong>Error:</strong> ${error.message}. Make sure the API server is running.
                    </div>
                `;
                document.getElementById('error').style.display = 'block';
            }
        });

        function parseCarData(data) {
            // Parse and enhance each listing
            const parsedListings = data.listings.map(car => {
                return {
                    ...car,
                    parsedYear: parseYear(car.year, car.title),
                    parsedPrice: parsePrice(car.price),
                    parsedMileage: parseMileage(car.mileage, car.description),
                    parsedLocation: car.location || parseLocation(car.title, car.description),
                    cleanDescription: cleanDescription(car.description)
                };
            });

            return {
                ...data,
                listings: parsedListings
            };
        }

        function parseYear(year, title) {
            if (year) return year;
            // Try to extract year from title (4-digit number between 1900-2099)
            const yearMatch = title.match(/\b(19\d{2}|20\d{2})\b/);
            return yearMatch ? yearMatch[1] : 'N/A';
        }

        function parsePrice(price) {
            if (!price) return 'Contact for price';
            // Clean up price formatting
            const cleanPrice = price.replace(/[^\d.,]/g, '');
            if (cleanPrice) {
                return '$' + cleanPrice;
            }
            return price;
        }

        function parseMileage(mileage, description) {
            if (mileage) return mileage;
            // Try to extract mileage from description
            if (!description) return 'N/A';
            const kmMatch = description.match(/(\d{1,3}(?:,\d{3})*)\s*km/i);
            const miMatch = description.match(/(\d{1,3}(?:,\d{3})*)\s*mi(?:les)?/i);
            if (kmMatch) return kmMatch[1] + ' km';
            if (miMatch) return miMatch[1] + ' miles';
            return 'N/A';
        }

        function parseLocation(title, description) {
            // Common Canadian cities and provinces
            const locations = [
                'Toronto', 'Vancouver', 'Montreal', 'Calgary', 'Edmonton', 'Ottawa',
                'Winnipeg', 'Quebec', 'Hamilton', 'Kitchener', 'London', 'Victoria',
                'Halifax', 'Oshawa', 'Windsor', 'Saskatoon', 'Regina', 'Barrie',
                'Ontario', 'BC', 'British Columbia', 'Alberta', 'Quebec', 'Manitoba',
                'Saskatchewan', 'Nova Scotia', 'New Brunswick', 'ON', 'AB', 'QC'
            ];
            
            const text = (title + ' ' + (description || '')).toLowerCase();
            for (const location of locations) {
                if (text.includes(location.toLowerCase())) {
                    return location;
                }
            }
            return 'N/A';
        }

        function cleanDescription(description) {
            if (!description) return '';
            // Remove extra whitespace and limit length
            const cleaned = description.trim().replace(/\s+/g, ' ');
            return cleaned.length > 200 ? cleaned.substring(0, 200) + '...' : cleaned;
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            const statsDiv = document.getElementById('stats');
            const gridDiv = document.getElementById('resultsGrid');
            
            if (data.total_count === 0) {
                resultsDiv.innerHTML = `
                    <div class="search-card no-results">
                        <h2>No listings found</h2>
                        <p>Try adjusting your search criteria</p>
                    </div>
                `;
                resultsDiv.style.display = 'block';
                return;
            }
            
            // Display statistics
            let statsHTML = `
                <div class="stat-item">
                    <div class="stat-number">${data.total_count}</div>
                    <div class="stat-label">Total Listings</div>
                </div>
            `;
            
            for (const [source, count] of Object.entries(data.by_source)) {
                statsHTML += `
                    <div class="stat-item">
                        <div class="stat-number">${count}</div>
                        <div class="stat-label">${source}</div>
                    </div>
                `;
            }
            
            statsDiv.innerHTML = statsHTML;
            
            // Display car listings in grid view
            gridDiv.innerHTML = data.listings.map(car => `
                <div class="car-card">
                    <div class="car-source">${escapeHtml(car.source)}</div>
                    <div class="car-title">${escapeHtml(car.title)}</div>
                    <div class="car-price">${escapeHtml(car.parsedPrice)}</div>
                    <div class="car-details">
                        <div class="detail-item">
                            <span class="detail-label">Year:</span>
                            <span>${escapeHtml(car.parsedYear)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Mileage:</span>
                            <span>${escapeHtml(car.parsedMileage)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Make:</span>
                            <span>${escapeHtml(car.make)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Model:</span>
                            <span>${escapeHtml(car.model)}</span>
                        </div>
                        <div class="detail-item" style="grid-column: 1 / -1;">
                            <span class="detail-label">Location:</span>
                            <span>${escapeHtml(car.parsedLocation)}</span>
                        </div>
                    </div>
                    ${car.cleanDescription ? `
                        <div class="car-description">${escapeHtml(car.cleanDescription)}</div>
                    ` : ''}
                    <a href="${escapeHtml(car.url)}" target="_blank" class="car-link">View Listing →</a>
                </div>
            `).join('');
            
            // Display car listings in table view
            const tableDiv = document.getElementById('resultsTable');
            tableDiv.innerHTML = `
                <table class="results-table" id="sortableTable">
                    <thead>
                        <tr>
                            <th>Source</th>
                            <th class="sortable" data-column="year" data-type="number">Year</th>
                            <th>Make/Model</th>
                            <th class="sortable" data-column="price" data-type="number">Price</th>
                            <th class="sortable" data-column="mileage" data-type="number">Mileage</th>
                            <th>Location</th>
                            <th>Description</th>
                            <th>Link</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.listings.map(car => `
                            <tr>
                                <td><span class="table-source">${escapeHtml(car.source)}</span></td>
                                <td class="table-year" data-value="${car.parsedYear}">${escapeHtml(car.parsedYear)}</td>
                                <td>${escapeHtml(car.make)} ${escapeHtml(car.model)}</td>
                                <td class="table-price" data-value="${extractNumber(car.parsedPrice)}">${escapeHtml(car.parsedPrice)}</td>
                                <td data-value="${extractNumber(car.parsedMileage)}">${escapeHtml(car.parsedMileage)}</td>
                                <td>${escapeHtml(car.parsedLocation)}</td>
                                <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${escapeHtml(car.cleanDescription)}">
                                    ${escapeHtml(car.cleanDescription || 'N/A')}
                                </td>
                                <td>
                                    <a href="${escapeHtml(car.url)}" target="_blank" class="table-link">View →</a>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            // Add sorting functionality
            setupTableSorting();
            
            resultsDiv.style.display = 'block';
        }

        function extractNumber(str) {
            if (!str) return 0;
            const match = str.match(/[\d,]+/);
            if (!match) return 0;
            return parseFloat(match[0].replace(/,/g, ''));
        }

        function setupTableSorting() {
            const table = document.getElementById('sortableTable');
            if (!table) return;

            const headers = table.querySelectorAll('th.sortable');
            let currentSort = { column: null, direction: 'asc' };

            headers.forEach(header => {
                header.addEventListener('click', () => {
                    const column = header.dataset.column;
                    const type = header.dataset.type;

                    // Toggle sort direction
                    if (currentSort.column === column) {
                        currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
                    } else {
                        currentSort.direction = 'asc';
                        currentSort.column = column;
                    }

                    // Remove sorted classes from all headers
                    headers.forEach(h => {
                        h.classList.remove('sorted-asc', 'sorted-desc');
                    });

                    // Add sorted class to current header
                    header.classList.add(`sorted-${currentSort.direction}`);

                    // Sort the table
                    sortTable(table, column, type, currentSort.direction);
                });
            });
        }

        function sortTable(table, column, type, direction) {
            const tbody = table.querySelector('tbody');
            const rows = Array.from(tbody.querySelectorAll('tr'));

            // Map column names to cell indices
            const columnIndex = {
                'year': 1,
                'price': 3,
                'mileage': 4
            }[column];

            rows.sort((a, b) => {
                const aValue = a.cells[columnIndex].dataset.value;
                const bValue = b.cells[columnIndex].dataset.value;

                let comparison = 0;
                if (type === 'number') {
                    const aNum = parseFloat(aValue) || 0;
                    const bNum = parseFloat(bValue) || 0;
                    comparison = aNum - bNum;
                } else {
                    comparison = aValue.localeCompare(bValue);
                }

                return direction === 'asc' ? comparison : -comparison;
            });

            // Clear and re-append sorted rows
            tbody.innerHTML = '';
            rows.forEach(row => tbody.appendChild(row));
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
